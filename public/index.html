<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>デコモジファインダー</title>
    <link rel="icon" href="/favicon.ico" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Icons&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap&amp;subset=japanese"
    />

    <!-- Tailwind をブラウザ上でコンパイルする。ビルド版と違い、実行時に DOM を走査してCSSを生成する -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.16"></script>

    <!-- 素の import 文を CDN に解決させる。vue-virtual にも同じ vue を使わせるため ?external=vue を付ける -->
    <script type="importmap">
      {
        "imports": {
          "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.23/dist/vue.esm-browser.prod.js",
          "@tanstack/vue-virtual": "https://esm.sh/@tanstack/vue-virtual@3.13.35?external=vue"
        }
      }
    </script>

    <style>
      :root {
        /* Slack Aubergine テーマの紫 */
        --aubergine-800: #240726;
        --aubergine-900: #1f061f;
        /* くすんだブルー */
        --danube-200: #adbfca;
        --danube-600: #5c7280;
        /* 黒そうで黒くない、少しだけ青い黒 */
        --night-800: #110f13;
        --night-900: #0e0d10;
        /* Slack で自分がリアクションしたときの青 */
        --sea-200: #e6f3fa;
        --sea-500: #1d89c7;
        --sea-800: #135092;
        /* 無彩色系 */
        --shade-100: #ffffff;
        --shade-200: #f4f4f4;
        --shade-400: #727272;
        --shade-500: #424242;
        --shade-700: #1a1c20;
        --shade-800: #15171a;
        --shade-900: #000000;

        --outline-danube-200: 0 0 0 4px var(--danube-200);
        --outline-danube-600: 0 0 0 4px var(--danube-600);

        /* 中間ラベル */
        --bgBody: var(--shade-100);
        --colorBody: var(--shade-800);
        --bgHeader: var(--aubergine-900);
        --colorHeader: var(--shade-200);
        --bgPanel: var(--aubergine-800);
        --colorSearch: var(--shade-200);
        --colorSearchFocus: var(--shade-800);
        --bgSearch: rgba(255, 255, 255, 0.25);
        --bgSearchFocus: rgba(255, 255, 255, 0.95);
        --colorDecomoji: var(--shade-800);
        --bgDecomoji: var(--shade-200);
        --bgDecomojiReacted: var(--sea-200);
        --borderDecomojiReacted: var(--sea-500);
        --bgDecomojiCollected: var(--shade-100);
        --borderDecomojiCollected: var(--shade-400);
        --colorCollected: var(--shade-800);
        --bgCollected: var(--shade-200);
        --focusDecomoji: var(--outline-danube-200);
        --colorFooter: var(--shade-200);
        --bgFooter: var(--aubergine-900);
        --bgTag: var(--shade-100);
        --colorTag: var(--shade-800);
      }

      .-dark {
        --bgBody: var(--shade-800);
        --colorBody: var(--shade-200);
        --bgHeader: var(--night-900);
        --bgPanel: var(--night-800);
        --colorDecomoji: var(--shade-200);
        --bgDecomoji: var(--shade-700);
        --bgDecomojiReacted: var(--sea-800);
        --borderDecomojiReacted: var(--sea-800);
        --bgDecomojiCollected: var(--shade-900);
        --borderDecomojiCollected: var(--shade-500);
        --colorCollected: var(--shade-200);
        --bgCollected: var(--shade-700);
        --focusDecomoji: var(--outline-danube-600);
        --bgFooter: var(--night-900);
        --bgTag: var(--shade-800);
        --colorTag: var(--shade-100);
      }

      /* https://github.com/ampproject/amphtml/blob/2e9a940e78df8de38a6c06a0772aeaa4839a24d1/css/ampshared.css#L164-L204 */
      .sr-only {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        display: block !important;
        width: 4px !important;
        height: 4px !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        opacity: 0 !important;
        overflow: hidden !important;
        visibility: visible !important;
      }

      #app:empty::before {
        display: block;
        padding: 2rem;
        content: "読み込み中…";
        font-family: sans-serif;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <!--
      アプリのテンプレート。ブラウザの HTML パーサーが解釈するため、
      SFC の <template> と違って属性名は大文字小文字を区別しない点に注意
    -->
    <template id="app-template">
      <div
        :class="[
          'grid grid-rows-[auto_1fr_auto_auto] min-h-screen text-sm text-(--colorBody) bg-(--bgBody)',
          {
            '-dark': state.dark,
          },
        ]"
      >
        <header
          class="sticky z-10 top-0 left-0 flex flex-wrap items-center gap-x-5 gap-y-2.5 p-2.5 w-full text-(--colorHeader) bg-(--bgHeader) shadow-[0_2px_4px_rgba(0,0,0,0.15),0_8px_8px_rgba(0,0,0,0.075)]"
        >
          <div class="flex items-center gap-2.5 basis-160 grow">
            <h1 class="flex-[0_0_auto]">
              <a class="block w-8 h-8 rounded-full overflow-hidden" href="/">
                <img
                  class="block"
                  src="/logo.png"
                  alt="デコモジファインダー"
                  width="32"
                  height="32"
                />
              </a>
            </h1>
            <div
              class="relative flex-[1_1_auto] text-(--colorSearch) focus-within:[--colorSearch:var(--colorSearchFocus)]"
            >
              <input
                v-model="state.search"
                class="py-2.5 pl-10 pr-28 rounded-md w-full text-base bg-(--bgSearch) focus:[--bgSearch:var(--bgSearchFocus)]"
                type="text"
                name="search"
                title="検索"
              />
              <span
                class="material-icons pointer-events-none absolute top-px bottom-0 left-2 m-auto w-6 h-6"
                aria-hidden="true"
                >search</span
              >
              <span
                class="pointer-events-none absolute top-0 bottom-0 right-2 m-auto h-4 leading-none"
                aria-hidden="true"
                >{{ filtered.length }}/{{ availableDecomojis.length }}</span
              >
              <span class="sr-only"
                >{{ availableDecomojis.length }}個中{{ filtered.length }}個が該当しています。</span
              >
            </div>

            <details class="relative sm:hidden" name="options">
              <summary class="p-2.5 rounded-md whitespace-nowrap">サイズ</summary>
              <div
                class="absolute right-0 z-10 flex flex-col gap-4 mt-1 p-4 rounded-md max-h-[50vh] bg-(--bgPanel) overflow-y-auto"
              >
                <label
                  v-for="{ text, value } in SIZE_LIST"
                  :key="value"
                  class="flex items-center gap-1 whitespace-nowrap"
                >
                  <input
                    :value="value"
                    :checked="state.size === value"
                    type="radio"
                    name="size"
                    @input="state.size = value"
                  />
                  {{ text }}
                </label>
              </div>
            </details>
          </div>

          <div class="flex items-center gap-2.5 basis-0 grow-999 min-w-[50%]">
            <details class="relative hidden sm:block" name="options">
              <summary class="py-1 px-2.5 rounded-md">サイズ</summary>
              <div
                class="absolute flex flex-col gap-2 p-4 rounded-md max-h-[50vh] bg-(--bgPanel) overflow-y-auto"
              >
                <label
                  v-for="{ text, value } in SIZE_LIST"
                  :key="value"
                  class="flex items-center gap-1 whitespace-nowrap"
                >
                  <input
                    :value="value"
                    :checked="state.size === value"
                    type="radio"
                    name="size"
                    @input="state.size = value"
                  />
                  {{ text }}
                </label>
              </div>
            </details>

            <details class="relative" name="options">
              <summary class="py-1 px-2.5 rounded-md">カテゴリー</summary>
              <div
                class="absolute flex flex-col gap-2 p-4 rounded-md max-h-[50vh] bg-(--bgPanel) overflow-y-auto"
              >
                <label
                  v-for="{ text, value } in CATEGORY_LIST"
                  :key="value"
                  class="flex items-center gap-1 whitespace-nowrap"
                >
                  <input
                    :value="value"
                    :checked="state.category[value]"
                    type="checkbox"
                    name="category"
                    @input="state.category[value] = !state.category[value]"
                  />
                  {{ text }}
                </label>
              </div>
            </details>

            <details class="relative" name="options">
              <summary class="py-1 px-2.5 rounded-md">バージョン</summary>
              <div
                class="absolute flex flex-col gap-2 p-4 rounded-md max-h-[50vh] bg-(--bgPanel) overflow-y-auto"
              >
                <label
                  v-for="{ text, value } in VERSION_LIST"
                  :key="value"
                  class="flex items-center gap-1 whitespace-nowrap"
                >
                  <input
                    :value="value"
                    :checked="state.version[value]"
                    type="checkbox"
                    name="version"
                    @input="state.version[value] = !state.version[value]"
                  />
                  {{ text }}
                </label>
                <button
                  :disabled="Object.values(state.version).every((v) => v)"
                  type="button"
                  class="flex justify-center items-center py-1 px-2 disabled:text-[rgba(255,255,255,0.25)]"
                  @click="availableVersions.forEach((value) => (state.version[value] = true))"
                >
                  全選択
                </button>
                <button
                  :disabled="!Object.values(state.version).some((v) => v)"
                  type="button"
                  class="flex justify-center items-center py-1 px-2 disabled:text-[rgba(255,255,255,0.25)]"
                  @click="availableVersions.forEach((value) => (state.version[value] = false))"
                >
                  全解除
                </button>
              </div>
            </details>

            <details class="relative" name="options">
              <summary class="py-1 px-2.5 rounded-md">オプション</summary>
              <div
                class="absolute right-0 flex flex-col gap-4 mt-1 p-4 rounded-md max-h-[50vh] bg-(--bgPanel) overflow-y-auto"
              >
                <label class="flex items-center gap-1 whitespace-nowrap">
                  <input
                    v-model="state.created"
                    :checked="(state.size === 'll' || state.size === '') && state.created"
                    :disabled="state.size !== 'll' && state.size !== ''"
                    type="checkbox"
                    name="option"
                  />
                  作成バージョンの表示
                </label>
                <label class="flex items-center gap-1 whitespace-nowrap">
                  <input
                    v-model="state.updated"
                    :checked="(state.size === 'll' || state.size === '') && state.updated"
                    :disabled="state.size !== 'll' && state.size !== ''"
                    type="checkbox"
                    name="option"
                  />
                  修正バージョンの表示
                </label>
                <label class="flex items-center gap-1 whitespace-nowrap">
                  <input
                    v-model="state.reacted"
                    :checked="state.reacted"
                    type="checkbox"
                    name="option"
                  />
                  リアクション済みのスタイル
                </label>
                <label class="flex items-center gap-1 whitespace-nowrap">
                  <input v-model="state.dark" :checked="state.dark" type="checkbox" name="option" />
                  ダークモード
                </label>
                <label class="flex items-center gap-1 whitespace-nowrap">
                  <input v-model="state.json" :checked="state.json" type="checkbox" name="option" />
                  検索結果をjson表示
                </label>
              </div>
            </details>
          </div>
        </header>

        <main>
          <h2 class="sr-only">デコモジ一覧</h2>
          <div
            ref="listRef"
            class="relative w-full"
            :style="{
              marginTop: `${metrics.gap}px`,
              height: `${totalSize}px`,
            }"
          >
            <div
              v-for="{ size, start, index } in virtualRows"
              :key="index"
              :class="['absolute top-0 left-0 w-full', classBySize.wrapper]"
              :data-index="index"
              :style="{
                height: `${size}px`,
                transform: `translateY(${start - listOffset}px)`,
              }"
            >
              <button
                v-for="{ name, path, collected, created, updated } in slicedRow(index)"
                :key="name"
                :class="[
                  classBySize.button,
                  {
                    'border-(--borderDecomojiReacted) bg-(--bgDecomojiReacted)':
                      !collected && state.reacted,
                    'border-transparent bg-(--bgDecomoji)': !collected && !state.reacted,
                    'border-(--borderDecomojiCollected) bg-(--bgDecomojiCollected)': collected,
                  },
                ]"
                @click="
                  collected
                    ? state.collected.splice(
                        state.collected.findIndex((v) => v.name === name),
                        1,
                      )
                    : state.collected.push({
                        name: name,
                        path: path,
                      })
                "
              >
                <img :alt="name" :src="path" :class="classBySize.image" height="64" width="64" />
                <span :class="classBySize.name">
                  <span aria-hidden="true">:</span>{{ name }}<span aria-hidden="true">:</span>
                </span>
                <span
                  v-if="(state.size === 'll' || state.size === '') && state.created"
                  class="absolute -top-2 -right-1.25 border border-solid border-(--borderDecomojiCollected) py-0.5 px-1.25 rounded-md text-(--colorTag) bg-(--bgTag)"
                >
                  <span class="sr-only">created:</span>{{ created }}
                </span>
                <span
                  v-if="(state.size === 'll' || state.size === '') && state.updated && updated"
                  class="absolute -top-2 -right-1.25 border border-solid border-(--borderDecomojiCollected) py-0.5 px-1.25 rounded-md text-(--colorTag) bg-(--bgTag)"
                >
                  <span class="sr-only">updated:</span>{{ updated }}</span
                >
              </button>
            </div>
          </div>
        </main>

        <section
          v-if="state.json"
          :class="[
            'sticky left-0 p-3 h-40 text-(--colorCollected) bg-(--bgCollected) shadow-[0_-2px_4px_rgba(0,0,0,0.15),0_-8px_8px_rgba(0,0,0,0.075)]',
            {
              'bottom-49 sm:bottom-51': state.collected.length > 0,
              'bottom-9 sm:bottom-11': state.collected.length < 1,
            },
          ]"
        >
          <h2 class="sr-only">マッチしたデコモジ一覧のJSON形式</h2>
          <textarea
            :value="JSON.stringify(filtered)"
            class="border rounded-md h-full w-full overflow-y-auto scroll-touch resize-none"
            title="マッチしたデコモジ一覧のJSON形式"
            readonly
          ></textarea>
        </section>

        <section
          v-if="state.collected.length"
          class="sticky left-0 bottom-9 sm:bottom-11 h-40 text-(--colorCollected) bg-(--bgCollected) shadow-[0_-2px_4px_rgba(0,0,0,0.15),0_-8px_8px_rgba(0,0,0,0.075)] overflow-y-auto scroll-touch"
        >
          <div class="flex justify-between items-center gap-1 p-2.5 pb-0">
            <h2 class="font-bold leading-[1.4]">コレクション：{{ state.collected.length }}</h2>
            <div class="flex gap-1">
              <button
                class="flex justify-center items-center w-10 h-6"
                title="コレクションをアルファベット順にソートする"
                @click="
                  state.collected = state.collected.sort((a, b) => a.name.localeCompare(b.name))
                "
              >
                <span class="material-icons" aria-hidden="true">sort</span>
              </button>
              <a
                class="flex justify-center items-center w-10 h-6"
                :href="downloadURL"
                download="my-collected.json"
              >
                <span class="sr-only">コレクションをJSON形式でダウンロードする</span>
                <span class="material-icons" aria-hidden="true">save_alt</span>
              </a>
              <button
                class="flex justify-center items-center w-10 h-6"
                title="コレクションを空にする"
                @click="state.collected.splice(0, state.collected.length)"
              >
                <span class="material-icons" aria-hidden="true">delete_forever</span>
              </button>
            </div>
          </div>
          <div :class="classBySize.cWrapper">
            <button
              v-for="({ name, path }, i) in state.collected"
              :key="`collected_${name}`"
              :class="classBySize.cButton"
              @dblclick="state.collected.splice(i, 1)"
              @keydown="state.collected.splice(i, 1)"
            >
              <img :alt="name" :src="path" :class="classBySize.image" height="64" width="64" />
            </button>
          </div>
        </section>

        <footer
          class="sticky z-10 bottom-0 left-0 flex items-center gap-5 p-2.5 w-full text-(--colorFooter) bg-(--bgFooter) shadow-[0_2px_4px_rgba(0,0,0,0.15),0_-8px_8px_rgba(0,0,0,0.075)] text-xs sm:text-base"
        >
          <p>
            このウェブアプリは
            <a href="https://twitter.com/otiext" class="underline">oti</a>
            が作りました。
          </p>
          <p class="ml-auto">
            <a href="https://github.com/decomoji/finder/" class="underline">GitHub</a>, MIT License.
          </p>
        </footer>
      </div>
    </template>

    <script type="module">
      import { computed, createApp, onBeforeMount, onMounted, reactive, ref, watch } from "vue";
      import { useWindowVirtualizer } from "@tanstack/vue-virtual";

      // ビルドしないので JSON はバンドルできない。起動時に取得する
      const [availableDecomojis, availableVersions] = await Promise.all([
        fetch("/configs/v5_all.json").then((res) => res.json()),
        fetch("/configs/v5_versions.json").then((res) => res.json()),
      ]);

      /**
       * オブジェクトのクラス名を文字列で返す
       * @param val
       */
      const getObjectClassName = (val) => Object.prototype.toString.call(val);

      /**
       * 値が文字列であるか否かを返す
       * @param val
       */
      const isString = (val) => getObjectClassName(val) === "[object String]";

      /**
       * 値が空ではない文字列であるか否かを返す
       * @param val
       */
      const isStringOfNotEmpty = (val) => isString(val) && val.length > 0;

      // 1行のレイアウトを算出するための実測値
      // 仮想スクロールはこの値から行数と行の高さを決めるため、
      // `classBySize()` が返す Tailwind のクラスと必ず一致させること
      const ROW_METRICS = {
        // gap-3 / px-3 / minmax(128px,1fr) / h-[128px]
        ll: { gap: 12, padding: 12, itemWidth: 128, itemHeight: 128 },
        // gap-2 / px-2 / minmax(80px,1fr) / h-[80px]
        l: { gap: 8, padding: 8, itemWidth: 80, itemHeight: 80 },
        // gap-1 / px-1 / minmax(42px,1fr) / h-[45px]
        m: { gap: 4, padding: 4, itemWidth: 42, itemHeight: 45 },
        // gap-0.5 / px-0.5 / minmax(24px,1fr) / h-[25px]
        s: { gap: 2, padding: 2, itemWidth: 24, itemHeight: 25 },
      };

      const availableCategories = ["basic", "extra", "explicit"];

      // { [category_name]: boolean } のオブジェクトを作る
      const createCategoryParams = (category) =>
        availableCategories.reduce(
          (acc, name) => ({
            ...acc,
            [name]: category.includes(name) ? true : false,
          }),
          {},
        );

      // { [version_name]: boolean } のオブジェクトを作る
      const createVersionParams = (version) =>
        availableVersions.reduce(
          (acc, name) => ({
            ...acc,
            [name]: version.includes(name) ? true : false,
          }),
          {},
        );

      // テンプレートで表示するためのサイズリスト
      const SIZE_LIST = [
        {
          text: "64px＆名前",
          value: "ll",
        },
        {
          text: "64px",
          value: "l",
        },
        {
          text: "32px",
          value: "m",
        },
        {
          text: "16px",
          value: "s",
        },
      ];

      // テンプレートで表示するためのカテゴリーリスト
      const CATEGORY_LIST = [
        {
          text: "基本セット",
          value: "basic",
        },
        {
          text: "拡張セット",
          value: "extra",
        },
        {
          text: "露骨セット",
          value: "explicit",
        },
      ];

      // テンプレートで表示するためのバージョンリスト
      const VERSION_LIST = availableVersions
        .map((value) => ({
          text: value,
          value,
        }))
        .sort((a, b) => a.value.localeCompare(b.value, undefined, { numeric: true }));

      createApp({
        template: "#app-template",
        setup() {
          // このアプリのステート
          const state = reactive({
            category: createCategoryParams([]),
            collected: [],
            created: false,
            dark: false,
            json: false,
            reacted: false,
            search: "",
            size: "",
            updated: false,
            version: createVersionParams([]),
          });

          // state.size に応じた1行のレイアウト実測値を返す
          const metrics = computed(() => ROW_METRICS[state.size || "ll"]);

          // state.size に応じた CSS クラス名のセットを返す
          const classBySize = computed(() => {
            let wrapper = "box-border grid grid-flow-row ";
            let cWrapper = wrapper;
            let button = "box-border relative border border-solid rounded-md text-center ";
            let cButton =
              button + "border border-solid border-transparent bg-(--bgDecomojiCollected) ";
            let image = "m-auto leading-none align-top ";
            let name = "block mt-2.5 text-(--colorDecomoji) break-all";

            switch (state.size) {
              case "s":
                wrapper += "gap-0.5 grid-cols-[repeat(auto-fill,minmax(24px,1fr))] px-0.5";
                cWrapper += "gap-0.5 grid-cols-[repeat(auto-fill,minmax(24px,1fr))] p-0.5";
                button += "h-[25px]";
                cButton += button;
                image += "w-[16px] h-[16px]";
                name = "sr-only";
                break;
              case "m":
                wrapper += "gap-1 grid-cols-[repeat(auto-fill,minmax(42px,1fr))] px-1";
                cWrapper += "gap-1 grid-cols-[repeat(auto-fill,minmax(42px,1fr))] p-1";
                button += "h-[45px]";
                cButton += button;
                image += "w-[32px] h-[32px]";
                name = "sr-only";
                break;
              case "l":
                wrapper += "gap-2 grid-cols-[repeat(auto-fill,minmax(80px,1fr))] px-2";
                cWrapper += "gap-2 grid-cols-[repeat(auto-fill,minmax(80px,1fr))] p-2";
                button += "h-[80px]";
                cButton += button;
                image += "w-[64px] h-[64px]";
                name = "sr-only";
                break;
              case "ll":
              default:
                wrapper += "gap-3 grid-cols-[repeat(auto-fill,minmax(128px,1fr))] px-3";
                cWrapper += "gap-3 grid-cols-[repeat(auto-fill,minmax(80px,1fr))] p-3";
                button += "h-[128px]";
                cButton += "h-[80px]";
                image += "w-[64px] h-[64px]";
                break;
            }
            return {
              wrapper,
              cWrapper,
              button,
              cButton,
              image,
              name,
            };
          });

          // RegExp インスタンスを computed にした方が速い
          const searchRegex = computed(() => RegExp(state.search));

          // 各種表示条件に合わせてフィルターしたデコモジリストを返す
          const filtered = computed(() => {
            const isMatched = ({ name, category, created, updated }) => {
              // デコモジの名前が検索クエリに含まれるか否か、または検索クエリが空であるか否か
              const nameMatches = searchRegex.value.test(name) || state.search === "";
              // デコモジのカテゴリーが表示するカテゴリーであるか、または何も選択されていないか否か
              const categoryMatches = state.category[category] || categoryParam.value === null;
              // デコモジの作成バージョンが、表示するバージョンであるか、または何も選択されていないか否か
              const createdMatches = state.version[created] || versionParam.value === null;
              // 修正バージョンが、表示するバージョンであるか否か、または何も選択されていないか否か
              const updatedMatches = updated
                ? state.version[updated] || versionParam.value === null
                : false;
              // 当該デコモジについて、カテゴリー、名前、バージョン、全てにマッチするか否かを返す
              return nameMatches && categoryMatches && (createdMatches || updatedMatches);
            };

            return availableDecomojis.flatMap((v) =>
              isMatched(v)
                ? {
                    ...v,
                    collected: state.collected.find((collcted) => collcted.name === v.name)
                      ? true
                      : undefined,
                  }
                : [],
            );
          });

          // 表示カテゴリーをパラメータ文字列に変換したものを返す
          const categoryParam = computed(() => {
            const arrayedCategories = Object.keys(state.category).filter(
              (key) => state.category[key],
            );
            return arrayedCategories.length > 0 ? `category=${arrayedCategories.join(",")}` : null;
          });

          // コレクションをパラメータ文字列に変換したものを返す
          const collectedParam = computed(() =>
            state.collected.length > 0
              ? `collected=${state.collected.map((v) => v.name).join(",")}`
              : null,
          );

          // 作成バージョン表示か否かをパラメータ文字列に変換したものを返す
          const createdParam = computed(() => (state.created ? "created" : null));

          // ダークモード表示か否かをパラメータ文字列に変換したものを返す
          const darkParam = computed(() => (state.dark ? "dark" : null));

          // JSONを表示するか否かをパラメータ文字列に変換したものを返す
          const jsonParam = computed(() => (state.json ? "json" : null));

          // リアクション済みスタイルか否かをパラメータ文字列に変換したものを返す
          const reactedParam = computed(() => (state.reacted ? "reacted" : null));

          // 検索クエリをパラメータ文字列に変換したものを返す
          const searchParam = computed(() =>
            isStringOfNotEmpty(state.search) ? `search=${encodeURIComponent(state.search)}` : null,
          );

          // 表示サイズをパラメータ文字列に変換したものを返す
          const sizeParam = computed(() =>
            isStringOfNotEmpty(state.size) ? `size=${state.size}` : null,
          );

          // 修正バージョン表示か否かをパラメータ文字列に変換したものを返す
          const updatedParam = computed(() => (state.updated ? "updated" : null));

          // 表示バージョンをパラメータ文字列に変換したものを返す
          const versionParam = computed(() => {
            const versions = Object.keys(state.version)
              .filter((key) => state.version[key])
              .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            return versions.length > 0 ? `version=${versions.join(",")}` : null;
          });

          // 各パラメータ文字列を連結したものを返す
          const urlParams = computed(() =>
            [
              searchParam.value,
              sizeParam.value,
              categoryParam.value,
              collectedParam.value,
              versionParam.value,
              createdParam.value,
              updatedParam.value,
              reactedParam.value,
              darkParam.value,
              jsonParam.value,
            ]
              .filter((v) => !!v)
              .join("&"),
          );

          // コレクションを JSON 化した URL を返す
          const downloadURL = computed(() =>
            window.URL.createObjectURL(
              new Blob([JSON.stringify(state.collected)], { type: "application/json" }),
            ),
          );

          // 1行に収められるアイテムの数を返す
          // `repeat(auto-fill, minmax(N, 1fr))` がとる列数と一致させる必要がある
          const rowItemLength = computed(() => {
            const { gap, padding, itemWidth } = metrics.value;
            // コンテナ幅から左右のパディングを引いたものが、グリッドのコンテンツ幅となる
            const content = listWidth.value - padding * 2;
            // n 列のとき必要な幅は `itemWidth * n + gap * (n - 1)` なので、両辺に gap を足して割る
            const length = Math.floor((content + gap) / (itemWidth + gap));
            // 0 を返すと行数が Infinity になってしまうため最低 1 を保証する
            return Math.max(1, length);
          });

          // 1行分の高さを返す
          const rowHeight = computed(() => metrics.value.itemHeight + metrics.value.gap);

          // 行を並べるコンテナ。幅とドキュメント上の開始位置はここを実測する
          const listRef = ref(null);
          const listWidth = ref(window.innerWidth);
          // `useWindowVirtualizer` は window.scrollY を基準に可視範囲を計算するため、
          // リストがドキュメント先頭から始まらない分をオフセットとして渡す必要がある
          const listOffset = ref(0);

          // コンテナを実測する。ヘッダーは折り返しで高さが変わるためリサイズのたびに測り直す
          const measureList = () => {
            if (!listRef.value) {
              return;
            }
            // clientWidth は整数に丸められて列数の判定が1つずれることがあるため実数で測る
            const { top, width } = listRef.value.getBoundingClientRect();
            listWidth.value = width;
            listOffset.value = top + window.scrollY;
          };

          const rowVirtualizer = useWindowVirtualizer(
            computed(() => ({
              count: Math.ceil(filtered.value.length / rowItemLength.value),
              estimateSize: () => rowHeight.value,
              scrollMargin: listOffset.value,
            })),
          );
          const virtualRows = computed(() => rowVirtualizer.value.getVirtualItems());
          const totalSize = computed(() => rowVirtualizer.value.getTotalSize());

          // n 行目に並べるデコモジを切り出して返す
          const slicedRow = (n) =>
            filtered.value.slice(rowItemLength.value * n, rowItemLength.value * (n + 1));

          // 項目が減って虚無を表示していたらスクロール位置を戻す
          watch(filtered, (newList, oldList) => {
            if (newList.length > oldList.length) {
              return;
            }

            const el = document.documentElement;
            // totalSize は仮想スクローラーの更新後にしか新しくならないため、ここでは自前で高さを出す
            const listHeight = Math.ceil(newList.length / rowItemLength.value) * rowHeight.value;
            const maxScrollTop = listOffset.value + listHeight - el.clientHeight; // 下部paddingは省略

            el.scrollTop = Math.min(el.scrollTop, maxScrollTop);
          });

          // state を監視してURLにパラメータを追加する
          watch(state, () =>
            window.history.replaceState(
              null,
              "",
              urlParams.value.length ? `?${urlParams.value}` : "/",
            ),
          );

          // URLパラメータから画面状態を復元する
          onBeforeMount(() => {
            const {
              category,
              collected,
              created,
              dark,
              reacted,
              search,
              size,
              updated,
              version,
              json,
            } = location.search
              // 先頭の `?` の除去
              .substring(1)
              // & で分割
              .split("&")
              // { key: value } に変形
              .reduce((acc, str) => {
                const [key, value] = str.split("=");
                return {
                  ...acc,
                  // キーだけある場合は真偽値のオプションと見做して　true にする
                  [key]: value === undefined ? true : value,
                };
              }, {});

            // state の各プロパティを更新
            state.search = search ? decodeURIComponent(search) : state.search;
            state.size = size ? size : state.size;
            state.category = category ? createCategoryParams(category.split(",")) : state.category;
            state.collected = collected
              ? collected.split(",").map((v) => ({
                  name: v,
                  path: availableDecomojis.find((decomoji) => decomoji.name === v).path,
                }))
              : state.collected;
            state.version = version ? createVersionParams(version.split(",")) : state.version;
            // undefined になり得るので真偽値にキャストする
            state.created = Boolean(created);
            state.dark = Boolean(dark);
            state.reacted = Boolean(reacted);
            state.updated = Boolean(updated);
            state.json = Boolean(json);
          });

          onMounted(() => {
            window.addEventListener("resize", measureList);
            measureList();
          });

          // テンプレートから参照するものだけを返す
          return {
            CATEGORY_LIST,
            SIZE_LIST,
            VERSION_LIST,
            availableDecomojis,
            availableVersions,
            classBySize,
            downloadURL,
            filtered,
            listOffset,
            listRef,
            metrics,
            slicedRow,
            state,
            totalSize,
            virtualRows,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
